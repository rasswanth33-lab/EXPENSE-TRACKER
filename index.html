<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="header-brand">
                <div class="header-icon-box">
                    <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" />
                        <path d="M3 5v14a2 2 0 0 0 2 2h16v-5" />
                        <path d="M18 12a2 2 0 0 0 0 4h4v-4Z" />
                    </svg>
                </div>
                <div>
                    <h1>Expense Tracker</h1>
                    <p>Track your money. Understand your habits.</p>
                </div>
            </div>
        </header>

        <section class="summary-card">
            <div class="summary-main">
                <div class="summary-header">
                    <span class="summary-label">Total Expenses</span>
                    <span id="expenseCountBadge" class="summary-count-badge">0 transactions</span>
                </div>
                <h2 id="totalSpent">₹0.00</h2>
                <p id="summaryFilterContext" class="summary-context">Across all categories</p>
            </div>
        </section>

        <!-- Spending Analytics — Donut Chart Card -->
        <section class="analytics-card">
            <div class="section-header">
                <h2>Spending Breakdown</h2>
            </div>
            <div class="analytics-container">
                <div class="chart-wrapper">
                    <svg id="donutChartSvg" class="donut-chart-svg" viewBox="0 0 200 200" aria-label="Spending breakdown circular donut chart" role="img">
                        <!-- Background empty circle track -->
                        <circle class="donut-track" cx="100" cy="100" r="75" />
                        <!-- Dynamic SVG donut segments -->
                        <g id="donutSegmentsGroup"></g>
                    </svg>
                    <div class="chart-center-content">
                        <span class="chart-center-label">Total</span>
                        <span id="chartCenterTotal" class="chart-center-value">₹0.00</span>
                    </div>
                </div>

                <div class="legend-wrapper">
                    <ul id="analyticsLegend" class="analytics-legend">
                        <!-- Legend items dynamically populated via JS -->
                    </ul>
                </div>
            </div>
            <p id="chartEmptyMessage" class="chart-empty-message">No expenses found for this selection.</p>
        </section>

        <section class="form-section">
            <div class="section-header">
                <h2>Add New Expense</h2>
            </div>

            <form id="expenseForm">

                <div class="form-group">
                    <label for="title">Expense Title</label>
                    <input type="text" id="title" placeholder="e.g. Lunch" autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="e.g. 180" min="0.01" step="any">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date">
                </div>

                <p id="errorMessage" class="error-message"></p>

                <div class="form-actions">
                    <button type="submit">Add Expense</button>
                </div>

            </form>
        </section>

        <section class="expenses-section">
            <div class="table-heading">
                <h2>Recent Transactions</h2>

                <select id="categoryFilter" aria-label="Filter transactions by category">
                    <option value="All">All Categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th class="text-right">Amount</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>

                    <tbody id="expenseTableBody">
                        <!-- JavaScript will add expenses here -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage">No expenses added yet.</p>
        </section>

    </div>

    <script src="script.js"></script>
</body>

</html>
